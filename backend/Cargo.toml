[package]
name = "jazzdomizer_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.43"
dotenvy = "0.15.7"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres"] }
strum = { version = "0.26", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }

#Optional dependencies
axum = { version = "0.8.8", optional = true }
tower-http = { version = "0.6.8", features = ["cors"], optional = true }
inquire = { version = "0.7", optional = true }
async-trait = { version = "0.1", optional = true }
once_cell = "1.21.4"
tower = "0.5.3"
bytes = "1.11.1"
futures-util = "0.3.32"

[features]
default = ["full"]
cli = ["dep:inquire", "dep:async-trait"]
web = ["dep:axum", "dep:tower-http"]
full = ["cli", "web"]

[dev-dependencies]
reqwest = "0.12"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0"
futures-util = "0.3.32"
urlencoding = "2.1.3"
