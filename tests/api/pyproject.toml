[project]
name = "jazzdomizer-api-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.13.5",
    "pydantic>=2.7.0",
    "psycopg[binary]>=3.2.0",
    "pytest>=8.3.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"  

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM",
    "ANN",  
    "TCH", 
    "RUF",
]

[tool.ty]
